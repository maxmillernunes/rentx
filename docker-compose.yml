version: '3.7'

services:
  postgres:
    image: postgres
    container_name: postgres_ignite
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=rentx
    volumes:
      - pgdata:/data/postgres

  redis:
    image: redis:alpine
    container_name: redis_ignite
    ports:
      - 6379:6379

  # app:
  #   build: .
  #   container_name: rentx
  #   ports:
  #     - 3333:3333
  #   volumes:
  #     - .:/usr/app
  #   links:
  #     - postgres
  #   depends_on:
  #     - postgres

volumes:
  pgdata:
    driver: local
